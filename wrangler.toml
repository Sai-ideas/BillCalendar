name = "billcalendar"
main = "src/server/index.ts"
compatibility_date = "2025-02-04"

[assets]
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Default / Public Production Deployment Configuration (Fail-Closed):
# Test identity simulation is disabled by default on public entrypoints.
[vars]
APP_ENV = "production"
ALLOW_TEST_IDENTITY = "false"
DEFAULT_TIMEZONE = "Asia/Taipei"

[[d1_databases]]
binding = "DB"
database_name = "billcalendar-db-prod"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

# Staging Environment Configuration (Isolated D1, Test Identity Disabled by Default)
[env.staging.vars]
APP_ENV = "staging"
ALLOW_TEST_IDENTITY = "false"
DEFAULT_TIMEZONE = "Asia/Taipei"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "billcalendar-db-staging"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"

# Local Controlled Development / Demo Environment Configuration
[env.development.vars]
APP_ENV = "development"
ALLOW_TEST_IDENTITY = "true"
DEFAULT_TIMEZONE = "Asia/Taipei"

[[env.development.d1_databases]]
binding = "DB"
database_name = "billcalendar-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "drizzle"
